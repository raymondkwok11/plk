<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>MP3 語音播放器FA3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            gap: 20px;
        }
        .btn {
            width: 320px;
            padding: 15px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover { background-color: #0056b3; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <button class="btn" onclick="playAudio('1.mp3')">1. 男孩的行為正確認嗎？</button>
    <button class="btn" onclick="playAudio('2.mp3')">2. 男孩的行為會對河裏的生物有麼影響？</button>
    <button class="btn" onclick="playAudio('3.mp3')">3. 男孩應該如何處理垃圾？</button>

    <script>
        let currentAudio = null;

        function playAudio(filename) {
            // 如果當前有在播放音訊，先停止並重置
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            // 建立並播放新的音訊
            currentAudio = new Audio(filename);
            currentAudio.play();
        }
    </script>

</body>
</html>
